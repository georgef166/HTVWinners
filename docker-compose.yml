# One-command deploy on a Vultr server:     docker compose up -d
# Plus our own model (CPU is fine):          docker compose --profile model up -d
#   and set LLM_BASE_URL=http://ollama:11434/v1 in .env
# On a Vultr GPU server, add the GPU file:   docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile model up -d
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
      TZ: ${TZ:-America/Toronto}
      PUBLIC_URL: https://${SITE_HOST:?set SITE_HOST in .env}
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/postgres?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  # Tiger Data (TimescaleDB): hypertable, compression, retention and continuous aggregates are set up by the app.
  db:
    image: timescale/timescaledb-ha:pg17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - tiger-data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  # Our own model, private to this server (no ports published). Runs on CPU; see docker-compose.gpu.yml for GPU.
  ollama:
    image: ollama/ollama
    restart: unless-stopped
    profiles: ["model"]
    volumes:
      - ollama:/root/.ollama

  # Speech-to-text for the 30-second distress checks (Whisper, CPU), private to this server.
  whisper:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    restart: unless-stopped
    profiles: ["model"]
    volumes:
      - whisper-models:/home/ubuntu/.cache/huggingface/hub

  # Grafana on top of Tiger Data, served at /grafana. Read-only for visitors.
  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      GF_SERVER_ROOT_URL: https://${SITE_HOST}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/night-out-switch.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_HOST: ${SITE_HOST}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app

volumes:
  tiger-data:
  ollama:
  caddy-data:
  whisper-models:
  grafana-data:
