<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>tenshi · Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/motion.css" />
  <script src="/motion.js"></script>
  <style>
    html, body { height: 100%; }
    body { overflow: hidden; }
    /* Flat red tint while Maya is silent, on an overlay so it can fade */
    body::before { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: rgb(var(--signal-rgb) / .08); opacity: 0; transition: opacity .9s ease; }
    body.silent::before { opacity: 1; }

    .tool { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13.5px; font-weight: 500; white-space: nowrap; color: rgb(var(--paper-rgb) / .82); transition: background-color .15s ease, color .15s ease, transform .1s ease; }
    .tool svg { opacity: .7; }
    .tool:hover { background: rgb(var(--paper-rgb) / .09); color: var(--paper); }
    .tool:active { transform: scale(.97); }
    .tool.solo { box-shadow: inset 0 0 0 1px rgb(var(--paper-rgb) / .12); }
    /* Presenter tray: the demo triggers live here, out of the judges' way */
    #tray { position: fixed; left: 24px; bottom: 20px; z-index: 40; }
    #trayBtn { height: 36px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 500; color: rgb(var(--paper-rgb) / .6); box-shadow: inset 0 0 0 1px rgb(var(--paper-rgb) / .12); }
    #trayBtn:hover, #trayBtn[aria-expanded="true"] { color: var(--paper); background: rgb(var(--paper-rgb) / .08); }
    #trayMenu { position: absolute; left: 0; bottom: calc(100% + 8px); width: 260px; padding: 6px; border-radius: 16px; background: rgb(var(--dusk-rgb)); box-shadow: inset 0 0 0 1px rgb(var(--paper-rgb) / .1); display: none; }
    #trayMenu.open { display: block; }
    #trayMenu .tool { width: 100%; justify-content: space-between; height: 40px; border-radius: 8px; }
    #trayMenu kbd { font: 500 12px var(--font-text); color: var(--mist); padding: 2px 7px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgb(var(--paper-rgb) / .14); }
    .tool.fired { background: rgb(var(--sodium-rgb) / .22); color: var(--paper); }
    .tool[aria-pressed="true"] { background: var(--paper); color: var(--ink); }
    .tool[aria-pressed="true"] svg { opacity: 1; }
    .tool.primary { background: var(--sodium); color: var(--on-sodium); font-weight: 600; }
    .tool.primary:hover { background: rgb(var(--sodium-rgb) / .88); }
    #qrPop { position: absolute; right: 0; top: calc(100% + 10px); z-index: 60; display: flex; gap: 12px; padding: 12px; border-radius: 16px; background: rgb(var(--dusk-rgb)); box-shadow: inset 0 0 0 1px rgb(var(--paper-rgb) / .1), 0 30px 60px -20px #000; opacity: 0; transform: translateY(-6px) scale(.98); transform-origin: top right; pointer-events: none; transition: opacity .18s ease, transform .22s var(--ease-out); }
    #qrPop.open { opacity: 1; transform: none; pointer-events: auto; }
    #qrPop figure { flex: none; margin: 0; text-align: center; }
    #qrPop img { display: block; width: 148px; height: 148px; max-width: none; border-radius: 8px; background: #fff; padding: 6px; }
    #qrPop figcaption { margin-top: 8px; font-size: 13px; font-weight: 600; color: var(--paper); }

    .stage { display: grid; grid-template-columns: auto minmax(48px, 110px) minmax(0, 1fr) minmax(48px, 110px) auto; align-items: center; height: calc(100vh - 72px); padding: 0 32px 28px; }
    .device { position: relative; width: calc(375px * var(--s)); height: calc(780px * var(--s)); border-radius: calc(52px * var(--s)); padding: calc(10px * var(--s)); background: #0C0D14; box-shadow: 0 0 0 1px rgb(255 255 255 / .14), inset 0 0 0 1px rgb(255 255 255 / .05), 0 40px 100px -30px #000; }
    /* Phones fade in once their page has painted, instead of flashing white */
    .device iframe { width: 375px; height: 760px; border: 0; border-radius: 42px; transform: scale(var(--s)); transform-origin: top left; background: transparent; opacity: 0; transition: opacity .45s ease; }
    .device iframe.ready { opacity: 1; }
    .device .who { position: absolute; top: calc(100% + 14px); left: 0; right: 0; text-align: center; font-size: 16px; font-weight: 600; color: var(--mist); }
    :root { --s: .72; }
    @media (max-height: 760px) { :root { --s: .62; } }
    @media (min-height: 900px) { :root { --s: .82; } }

    /* Wires carry real events between the phones and the server */
    .wire { position: relative; margin: 0 16px; height: 4px; border-radius: 4px; background: repeating-linear-gradient(90deg, rgba(174,181,218,.35) 0 8px, transparent 8px 16px); background-size: 32px 4px; animation: flow 1.2s linear infinite; }
    .silent .wire.out { background: repeating-linear-gradient(90deg, rgb(var(--signal-rgb) / .6) 0 8px, transparent 8px 16px); background-size: 32px 4px; }
    @keyframes flow { to { background-position: 32px 0; } }
    .packet { position: absolute; top: 50%; left: 0; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; will-change: transform; }
    .packet.big { width: 26px; height: 26px; margin: -13px 0 0 -13px; }

    /* Readout: one phase, one number, readable from across the room */
    .phase { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.035em; line-height: 1; font-size: clamp(44px, 4.6vw, 80px); color: rgb(var(--tone)); }
    .count { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.04em; line-height: .9; font-size: clamp(96px, 10vw, 150px); font-variant-numeric: tabular-nums; }
    .count-label { font-size: 20px; font-weight: 500; color: var(--mist); }
    #status { font-size: 22px; line-height: 1.35; color: rgb(var(--paper-rgb) / .86); min-height: 2.7em; text-wrap: balance; max-width: 30ch; }
    .route-stage { --dot: 22px; --track: 4px; --dot-mid: 11px; }
    .route-stage .stop-name { font-size: 18px; margin-top: .7rem; }
    /* Feed: the last three events, neutral text, the colour lives in the dot */
    .feed { height: 120px; overflow: hidden; }
    .feed li { display: grid; grid-template-columns: 96px 10px 1fr; align-items: center; column-gap: 14px; height: 32px; margin-bottom: 8px; animation: feed-in .4s var(--ease-out) both; }
    .feed .t { font-size: 15px; color: var(--mist); font-variant-numeric: tabular-nums; }
    .feed .d { width: 10px; height: 10px; border-radius: 50%; }
    .feed .x { font-size: 19px; font-weight: 500; color: rgb(var(--paper-rgb) / .92); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .feed li:nth-child(n+2) .x { color: rgb(var(--paper-rgb) / .62); }
    @keyframes feed-in { from { opacity: 0; transform: translateY(-8px); } }
    .ping { animation: stage-ping .9s ease-out; }
    @keyframes stage-ping { 0% { box-shadow: 0 0 0 0 rgb(var(--signal-rgb) / .9), 0 0 0 1.5px rgb(var(--signal-rgb)); } 100% { box-shadow: 0 0 0 40px rgb(var(--signal-rgb) / 0), 0 0 0 1px rgb(255 255 255 / .14); } }

    #start { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; overflow: hidden; transition: opacity .6s ease, transform .9s cubic-bezier(.7,0,.84,0); }
    #start.leave { opacity: 0; transform: scale(1.06); pointer-events: none; }
    /* Devices fly in from the wings once the night starts */
    .stage .device { opacity: 0; transform: translateX(var(--from, 0)) rotateY(var(--turn, 0)) scale(.92); transition: opacity .9s ease, transform 1.2s cubic-bezier(.16,1,.3,1); }
    #mayaDevice { --from: -40vw; --turn: 28deg; }
    #jordanDevice { --from: 40vw; --turn: -28deg; }
    .stage { perspective: 1600px; }
    .stage.live .device { opacity: 1; transform: none; }
    .stage .wire, .stage > section { opacity: 0; transition: opacity .8s ease .6s; }
    .stage.live .wire, .stage.live > section { opacity: 1; }
    @media (prefers-reduced-motion: reduce) { .stage .device, .stage .wire, .stage > section { opacity: 1; transform: none; transition: none; } }
    @media (prefers-reduced-motion: reduce) { .wire { animation: none; } }
  </style>
  <link rel="stylesheet" href="/tw.css" />
</head>
<body class="streetlight theme-dark">
  <!-- One click unlocks sound for both phones and starts a fresh night -->
  <div id="start" class="streetlight">
        <div class="power-rings" id="startRings" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="relative flex items-center gap-3" data-reveal style="--i:0"><span id="startLogo"></span><span class="wordmark text-[26px]">tenshi</span></div>
    <h1 class="display relative mt-5 max-w-5xl px-6 text-[clamp(34px,4.3vw,60px)] font-extrabold leading-[1.04]" data-reveal style="--i:1">Two phones. One night.<br />No one presses a button.</h1>
    <p class="relative mt-6 max-w-xl px-6 text-xl text-mist" data-reveal style="--i:2; text-wrap: balance">Maya's phone on the left, her friend Jordan's on the right. Slide to start, then watch what happens when Maya goes quiet.</p>
    <div class="relative mt-12" data-reveal style="--i:3">
      <div id="startSwitch" class="slide-switch" role="switch" aria-checked="false" tabindex="0" aria-label="Slide to start the night">
        <span class="fill"></span>
        <span class="label"><span>Start the night</span></span>
        <span class="knob"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </div>
    </div>
  </div>

  <header class="relative z-20 flex h-[72px] items-center gap-3 px-8">
    <a href="/" class="flex items-center gap-3"><span id="logo"></span><span class="wordmark text-[22px]">tenshi</span></a>
    <span class="ml-1 flex items-center gap-2 rounded-full px-2.5 py-1 text-[12.5px] font-semibold text-paper/80 shadow-[inset_0_0_0_1px_rgb(var(--paper-rgb)/.12)]"><span class="breathe h-1.5 w-1.5 rounded-full bg-signal"></span>Live</span>
    <div class="ml-auto flex items-center gap-2.5">
      <a id="nightLink" target="_blank" rel="noopener" class="tool solo"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg>Maya's dashboard</a>
      <div class="relative">
        <button id="phoneBtn" class="tool primary" aria-expanded="false" aria-controls="qrPop">Try it on your phone</button>
        <div id="qrPop">
          <figure><img id="qrMaya" alt="QR code to open Maya's phone on your phone" /><figcaption>Be Maya</figcaption></figure>
          <figure><img id="qr" alt="QR code to open Jordan's view on your phone" /><figcaption>Be Jordan</figcaption></figure>
        </div>
      </div>
    </div>
  </header>

  <!-- Presenter tray: demo triggers, kept out of the story -->
  <div id="tray">
    <div id="trayMenu" role="menu" aria-label="Presenter controls">
      <button id="drain" class="tool" role="menuitem">Drain battery <kbd>B</kbd></button>
      <button id="cold" class="tool" role="menuitem" aria-pressed="false"><span>Switch reads −2°C</span> <kbd>C</kbd></button>
      <button id="distress" class="tool" role="menuitem">Phone hears “help” <kbd>H</kbd></button>
      <button id="restart" class="tool" role="menuitem">Restart the night <kbd>R</kbd></button>
    </div>
    <button id="trayBtn" aria-expanded="false" aria-controls="trayMenu">Presenter <kbd class="ml-1 text-[11px] opacity-70">P</kbd></button>
  </div>

  <main class="stage">
    <div class="device" id="mayaDevice"><iframe id="maya" title="Maya's phone" allow="autoplay; geolocation; microphone"></iframe><p class="who">Maya's phone</p></div>
    <div class="wire" id="wireIn"></div>

    <section class="flex min-w-0 flex-col justify-center gap-6 px-4" id="readout" style="--tone: var(--mint-rgb)">
      <div>
        <p id="statusKicker" class="phase">Out tonight</p>
        <div class="mt-4 flex items-end gap-4"><span id="count" class="count">0:00</span><span id="countLabel" class="count-label mb-3"></span></div>
        <p id="status" class="mt-4">Waiting to start</p>
      </div>
      <div id="route"></div>
      <ol id="feed" class="feed" aria-live="polite"></ol>
    </section>

    <div class="wire out" id="wireOut"></div>
    <div class="device" id="jordanDevice"><iframe id="jordan" title="Jordan's phone" allow="autoplay"></iframe><p class="who">Jordan's phone</p></div>
  </main>

  <script>
    const $ = (s) => document.querySelector(s);
    $('#logo').innerHTML = NOS.logo();
    $('#startLogo').innerHTML = NOS.logo('md', 96);

    let id = new URLSearchParams(location.search).get('id');
    let links = null;
    let seen = new Set();
    let lastLevel = null;
    let state = null;
    let deadline = null;
    let silentSince = null;

    // Feed tones map to the dot colour; the text itself stays neutral and readable.
    const TONE = { info: 'bg-sodium', wait: 'bg-amber', ok: 'bg-mint', alert: 'bg-signal', muted: 'bg-mist' };
    const FEED = {
      checkin_sent: ['Check-in sent to Maya’s phone', 'wait'],
      checkin_ack: ['Maya checked in', 'ok'],
      stand_down: ['Maya’s PIN cancelled the alarm', 'ok'],
      contact_ack: ['Jordan: “I’m on it”', 'ok'],
      resolved: ['Night ended', 'muted'],
    };
    const LEVEL_FEED = {
      ALARM: ['No answer. Maya’s alarm is sounding', 'alert'],
      CONTACT: ['Jordan alerted with her last location', 'alert'],
      WIDER: ['No reply from Jordan. Backup alerted', 'alert'],
    };
    // Packet colours come from the theme tokens so the wires match everything else.
    const css = getComputedStyle(document.body);
    const C = Object.fromEntries(['sodium', 'mint', 'signal', 'paper'].map((k) => [k, `rgb(${css.getPropertyValue(`--${k}-rgb`).trim()})`]));
    const DEVICE_FEED = { touch: 'Switch: touch check-in', code: 'Switch: joystick code entered', nfc: 'Switch: home tag tapped' };

    function packet(wire, { color, reverse = false, big = false, ms = 900 }) {
      const p = document.createElement('span');
      p.className = `packet${big ? ' big' : ''}`;
      p.style.background = color;
      p.style.boxShadow = `0 0 ${big ? 30 : 14}px ${big ? 8 : 3}px ${color}`;
      wire.appendChild(p);
      const w = wire.getBoundingClientRect().width;
      const at = (x) => ({ transform: `translateX(${x}px)` });
      p.animate([at(reverse ? w : 0), at(reverse ? 0 : w)], { duration: ms, easing: 'cubic-bezier(.5,0,.5,1)', fill: 'forwards' })
        .finished.then(() => p.remove());
    }

    function feed(text, tone, t) {
      const li = document.createElement('li');
      li.innerHTML = `<span class="t">${new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' })}</span><span class="d ${TONE[tone]}"></span><span class="x"></span>`;
      li.lastChild.textContent = text;
      $('#feed').prepend(li);
      while ($('#feed').children.length > 3) $('#feed').lastChild.remove();
    }

    // React to new events: feed lines and packets on the wires.
    function onEvent(e, animate) {
      const wIn = $('#wireIn'), wOut = $('#wireOut');
      if (e.kind === 'heartbeat') { if (animate) packet(wIn, { color: C.mint, ms: 700 }); return; }
      if (e.kind === 'distress_check') {
        const cues = e.detail?.cues || [];
        const said = cues.filter((c) => !/loud noise/.test(c));
        if (e.detail?.danger) feed(`Phone heard ${said.join(' and ') || cues.join(' and ')}`, 'alert', e.t);
        else feed(e.detail?.score >= 0.5 ? `Phone heard ${cues.join(' and ')}. Asking Maya if she’s OK` : `30-second check: ${cues.join(' and ') || 'nothing worrying'}`, e.detail?.score >= 0.5 ? 'alert' : 'muted', e.t);
        if (animate) packet(wIn, { color: C.signal });
        return;
      }
      if (e.kind === 'device' && DEVICE_FEED[e.detail?.type]) { feed(DEVICE_FEED[e.detail.type], 'info', e.t); if (animate) packet(wIn, { color: C.paper }); return; }
      if (e.kind === 'level_change') {
        const lf = LEVEL_FEED[e.detail?.to];
        if (lf) feed(lf[0], lf[1], e.t);
        if (animate && e.detail?.to === 'CONTACT') {
          packet(wOut, { color: C.signal, big: true, ms: 1100 });
          setTimeout(() => ping($('#jordanDevice')), 1050);
        }
        if (animate && e.detail?.to === 'ALARM') ping($('#mayaDevice'));
        if (e.detail?.from === null && e.detail?.to === 'ARMED') feed('Maya turned on tenshi', 'info', e.t);
        return;
      }
      const f = FEED[e.kind];
      if (!f) return;
      feed(f[0], f[1], e.t);
      if (!animate) return;
      if (e.kind === 'checkin_sent') packet(wIn, { color: C.sodium, reverse: true });
      if (e.kind === 'checkin_ack' || e.kind === 'stand_down') packet(wIn, { color: C.mint });
      if (e.kind === 'contact_ack') { packet(wOut, { color: C.mint, reverse: true }); setTimeout(() => packet(wIn, { color: C.mint, reverse: true }), 800); }
      if (e.kind === 'stand_down') setTimeout(() => packet(wOut, { color: C.mint }), 800);
    }
    function ping(el) { el.classList.remove('ping'); void el.offsetWidth; el.classList.add('ping'); }

    const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.max(0, s) % 60).padStart(2, '0')}`;
    // One phase word, one number and one sentence, in the phase's colour.
    function renderStatus() {
      if (!state) return;
      const left = NOS.clock.left(deadline) ?? 0;
      const quiet = silentSince ? Math.floor((Date.now() - silentSince) / 1000) : 0;
      const acked = state.contact_acked;
      const V = {
        ARMED: ['Out tonight', 'mint', fmt(left), 'until her check-in', left ? 'Maya is out. Her phone checks in when this reaches zero.' : 'Check-in going out now…'],
        NUDGE: ['Check-in', 'amber', `${left}s`, 'to answer', left ? '“Still good?” One tap from Maya says she’s fine.' : 'No answer. Sounding the alarm…'],
        ALARM: ['Alarm', 'signal', `${left}s`, 'until Jordan', left ? 'No answer, so her phone is loud. Only her PIN stops it.' : 'Alerting Jordan now…'],
        CONTACT: acked
          ? ['Jordan’s on it', 'mint', fmt(quiet), 'silent', 'Jordan confirmed and is on the way with her last location.']
          : state.danger
            ? ['Jordan alerted', 'signal', fmt(Math.max(0, Math.floor((NOS.clock.now() - state.danger.at) / 1000))), 'since it heard', `Her phone heard ${state.danger.cues.filter((c) => !/loud noise/.test(c)).join(' and ') || 'shouting'}, so Jordan was alerted instantly.`]
            : ['Jordan alerted', 'signal', fmt(quiet), 'silent', left ? `Jordan has her last location. Her backup gets it in ${left}s unless he confirms.` : 'Alerting her backup contact now…'],
        WIDER: acked
          ? ['Jordan’s on it', 'mint', fmt(quiet), 'silent', 'Jordan confirmed and is on the way.']
          : ['Backup alerted', 'signal', fmt(quiet), 'silent', 'Jordan didn’t confirm, so her backup contact has the link too.'],
        RESOLVED: ['Home', 'mint', '', '', 'Night over. Everyone’s home.'],
      }[state.level];
      if (!V) return;
      const [phase, tone, count, label, line] = V;
      const set = (sel, v) => { if ($(sel).textContent !== v) $(sel).textContent = v; };
      set('#statusKicker', phase); set('#count', count); set('#countLabel', label); set('#status', line);
      $('#readout').style.setProperty('--tone', `var(--${tone}-rgb)`);
    }
    setInterval(renderStatus, 250);

    async function poll() {
      if (!id) return;
      try {
        const [t, s] = await Promise.all([
          fetch(`/api/sessions/${id}/trace`).then((r) => r.json()),
          fetch(`/api/sessions/${id}`).then((r) => r.json()),
        ]);
        state = s;
        NOS.clock.sync(s.now_ms);
        deadline = s.deadline_ms;
        const first = seen.size === 0;
        for (const e of t.events) {
          const key = `${e.t}|${e.kind}|${e.detail?.to || e.detail?.type || ''}`;
          if (seen.has(key)) continue;
          seen.add(key);
          onEvent(e, !first);
        }
        const silentLevels = ['NUDGE', 'ALARM', 'CONTACT', 'WIDER'];
        if (silentLevels.includes(s.level) && !silentLevels.includes(lastLevel)) {
          // Same definition as Jordan's page: time since her last response.
          const resp = [...t.events].reverse().find((e) => e.kind === 'checkin_ack' || e.kind === 'stand_down' || (e.kind === 'level_change' && e.detail?.to === 'ARMED'));
          silentSince = resp ? new Date(resp.t).getTime() : Date.now();
        }
        if (!silentLevels.includes(s.level)) silentSince = null;
        document.body.classList.toggle('silent', ['ALARM', 'CONTACT', 'WIDER'].includes(s.level) && !s.contact_acked);
        if (s.level !== lastLevel) NOS.route($('#route'), { level: s.level, variant: 'stage' });
        lastLevel = s.level;
        renderStatus();
      } catch {}
    }

    async function startNight() {
      if (!id) {
        const r = await fetch('/api/demo', { method: 'POST' }).then((r) => r.json());
        id = r.id;
        history.replaceState(null, '', `?id=${id}`);
      }
      links = await fetch(`/api/demo/${id}`).then((r) => r.json());
      // This screen keeps the Switch; another visitor's stage can't take it over mid-demo.
      let owner = null;
      try { owner = localStorage.getItem('nos_switch_owner') || crypto.randomUUID(); localStorage.setItem('nos_switch_owner', owner); } catch { owner = crypto.randomUUID(); }
      fetch(`/api/sessions/${id}/link-switch`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ owner }) }).catch(() => {});
      $('#qr').src = links.qr;
      $('#qrMaya').src = links.qr_me;
      $('#nightLink').href = `/night.html?id=${id}`;
      loadPhone($('#maya'), `/me.html?id=${id}&stage=1`);
      loadPhone($('#jordan'), `/contact.html?t=${links.contactToken}&stage=1`);
      seen = new Set(); lastLevel = null; $('#feed').innerHTML = ''; $('#cold').setAttribute('aria-pressed', 'false');
      poll();
    }
    setInterval(poll, 1000);
    function loadPhone(frame, src) {
      frame.classList.remove('ready');
      frame.onload = () => requestAnimationFrame(() => frame.classList.add('ready'));
      frame.src = src;
    }

    // Opening scene: city lights, the letterbox opens, then flip the switch to start.
    requestAnimationFrame(() => $('#start').classList.add('open'));
    NOS_MOTION.reveal($('#start'));
    NOS_MOTION.slideSwitch($('#startSwitch'), async () => {
      // Always a fresh night, even if the URL still holds an old one.
      id = null;
      // This gesture lets both embedded phones make sound.
      try { window.NOS_AUDIO = new (window.AudioContext || window.webkitAudioContext)(); window.NOS_AUDIO.resume(); } catch {}
      $('#startRings').classList.add('go');
      const night = startNight();
      setTimeout(() => $('#start').classList.add('leave'), 450);
      setTimeout(() => { $('.stage').classList.add('live'); $('#start').remove(); }, 1100);
      await night;
    });
    $('#restart').addEventListener('click', async () => { id = null; await startNight(); });
    // Presenter tray, plus keyboard shortcuts so the triggers never need to be on screen
    const tray = $('#trayMenu'), trayBtn = $('#trayBtn');
    const showTray = (open) => { tray.classList.toggle('open', open); trayBtn.setAttribute('aria-expanded', String(open)); };
    trayBtn.addEventListener('click', (e) => { e.stopPropagation(); showTray(!tray.classList.contains('open')); });
    document.addEventListener('click', (e) => { if (!$('#tray').contains(e.target)) showTray(false); });
    document.addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey || /input|textarea/i.test(e.target.tagName)) return;
      const k = e.key.toLowerCase();
      const map = { b: '#drain', c: '#cold', h: '#distress', d: '#nightLink', r: '#restart' };
      if (k === 'p') showTray(!tray.classList.contains('open'));
      else if (k === 'escape') showTray(false);
      else if (map[k] && id) $(map[k]).click();
    });
    // Brief highlight so the presenter sees the click landed.
    function fired(btn) { btn.classList.add('fired'); clearTimeout(btn._t); btn._t = setTimeout(() => btn.classList.remove('fired'), 1200); }
    $('#drain').addEventListener('click', (e) => { if (!id) return; fired(e.currentTarget); fetch(`/api/demo/${id}/drain-battery`, { method: 'POST' }); });
    $('#distress').addEventListener('click', (e) => { if (!id) return; fired(e.currentTarget); fetch(`/api/demo/${id}/distress`, { method: 'POST' }); });
    $('#cold').addEventListener('click', async (e) => {
      if (!id) return;
      const btn = e.currentTarget;
      const { cold } = await fetch(`/api/demo/${id}/cold`, { method: 'POST' }).then((r) => r.json());
      btn.setAttribute('aria-pressed', String(!!cold));
    });
    const pop = $('#qrPop'), phoneBtn = $('#phoneBtn');
    const showQr = (open) => { pop.classList.toggle('open', open); phoneBtn.setAttribute('aria-expanded', String(open)); };
    phoneBtn.addEventListener('click', (e) => { e.stopPropagation(); showQr(!pop.classList.contains('open')); });
    document.addEventListener('click', (e) => { if (!pop.contains(e.target)) showQr(false); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') showQr(false); });
  </script>
</body>
</html>
