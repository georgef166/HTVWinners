apiVersion: 1
# Tiger Data: Tiger Cloud when TIGER_* is set in .env, otherwise the local TimescaleDB container.
datasources:
  - name: Tiger Data
    uid: tiger
    type: grafana-postgresql-datasource
    url: $DS_HOST
    user: $DS_USER
    isDefault: true
    secureJsonData:
      password: $DS_PASSWORD
    jsonData:
      database: $DS_DATABASE
      sslmode: $DS_SSLMODE
      postgresVersion: 1700
      timescaledb: true
